name: Release builder

on:
  workflow_dispatch:
    inputs:
      action:
        description: Validate only, prepare a version PR, or publish reviewed versions
        type: choice
        options:
          - validate
          - version
          - publish
        default: validate

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require prepared release notes
        if: inputs.action == 'publish'
        run: pnpm run release:check
      - run: pnpm run test:release
      - run: pnpm run test:api
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run check:docs
      - run: pnpm run build
      - run: node scripts/check-api.mjs
      - run: node scripts/check-release-artifacts.mjs
      - run: pnpm run release:dry-run --consumer
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:packages:e2e
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-reports
          path: |
            tmp/playwright/test-results
            tmp/package-consumer-results
            dist/.playwright/apps/studio/playwright-report
          if-no-files-found: ignore

  version:
    needs: validate
    if: inputs.action == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@v1
        with:
          version: pnpm run release:version
          title: 'chore(release): version builder'
          commit: 'chore(release): version builder'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: validate
    if: inputs.action == 'publish'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Require npm publishing credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo '::error::Add NPM_TOKEN to the npm-release environment before publishing.'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Publish builder, its tag, and GitHub release notes
        uses: changesets/action@v1
        with:
          publish: pnpm run release:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
