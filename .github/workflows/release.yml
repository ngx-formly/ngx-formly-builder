name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed versions on main (otherwise prepare a version PR)
        type: boolean
        default: false

concurrency:
  group: package-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:release
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run check:docs
      - run: pnpm run build
      - run: node scripts/check-release-artifacts.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check:packages:e2e
      - run: pnpm run test:e2e
      - name: Prepare a version pull request
        if: ${{ !inputs.publish }}
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
          title: 'chore(release): version changed packages'
          commit: 'chore(release): version changed packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require reviewed version changes
        if: inputs.publish
        run: |
          pnpm run release:status --output /tmp/release-status.json
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('/tmp/release-status.json')).changesets.length) throw new Error('Merge the version PR before publishing')"
      - name: Publish built packages and record package tags
        if: inputs.publish
        uses: changesets/action@v1
        with:
          publish: pnpm run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
